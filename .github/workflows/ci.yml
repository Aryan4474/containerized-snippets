name: Continuous Integration (CI)

# Trigger this workflow on pushes to main/master branches or pull requests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI (Node & Docker Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Verify Backend Code Compilation
        working-directory: ./backend
        run: |
          node -e "
            try {
              require('./src/models/Paste');
              require('./src/utils/idGenerator');
              require('./src/utils/dateHelper');
              require('./src/config/index');
              console.log('--- CI BACKEND COMPILATION SUCCESSFUL ---');
            } catch (err) {
              console.error('Code compilation check failed:', err.message);
              process.exit(1);
            }
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: pastebin-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-ci:
    name: Frontend CI (React & Nginx Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Validate React App Compile (Build)
        working-directory: ./frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: pastebin-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
