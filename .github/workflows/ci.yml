name: Continuous Integration (CI)

# Trigger this workflow on pushes to main/master branches or pull requests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Verify Docker Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from GitHub repository to the virtual machine runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment matching our production environment (Node 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Automatically caches node_modules in GitHub actions for faster subsequent builds
          cache-dependency-path: './app/package-lock.json'

      # Step 3: Install all dependencies cleanly using package-lock.json
      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      # Step 4: Run a syntax compilation check on crucial backend files to prevent runtime crashes
      - name: Verify Code Compilation
        working-directory: ./app
        run: |
          node -e "
            try {
              require('./src/models/Paste');
              require('./src/utils/idGenerator');
              require('./src/utils/dateHelper');
              require('./src/config/index');
              console.log('--- CI CODE COMPILATION SUCCESSFUL ---');
            } catch (err) {
              console.error('Code compilation check failed:', err.message);
              process.exit(1);
            }
          "

      # Step 5: Set up Docker Buildx (extended build capabilities supporting multi-platform, cache, etc.)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Build the Docker image locally to verify the Dockerfile compiles correctly.
      # Setting 'push: false' ensures we only test the build without pushing to Docker Hub.
      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: pastebin-clone-backend:latest
          cache-from: type=gha # Leverages GitHub Actions caching to speed up Docker layer building
          cache-to: type=gha,mode=max
