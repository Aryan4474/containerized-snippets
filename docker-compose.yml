version: '3.8'

services:
  # ==========================================
  # SERVICE 1: Express Backend Application
  # ==========================================
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pastebin_backend
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - NODE_ENV=production
      - BASE_URL=http://localhost:5050
      - MONGO_URI=mongodb://mongodb:27017/pastebin-db
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    # Wait until DB and Cache are healthy before booting the backend
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pastebin_network
    restart: unless-stopped

  # ==========================================
  # SERVICE 2: MongoDB Persistence Layer
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: pastebin_mongodb
    ports:
      - "27017:27017" # Exposed to host for development GUI access (Compass/Robo3T)
    volumes:
      - mongodb-data:/data/db
    networks:
      - pastebin_network
    restart: unless-stopped
    # Health check verifying MongoDB is ready to accept queries
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # SERVICE 3: Redis In-Memory Caching Layer
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: pastebin_redis
    ports:
      - "6379:6379" # Exposed to host for troubleshooting
    volumes:
      - redis-data:/data
    networks:
      - pastebin_network
    restart: unless-stopped
    # Health check verifying Redis is ready to accept commands
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ==========================================
# NETWORKS & VOLUMES CONFIGURATION
# ==========================================
networks:
  pastebin_network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
